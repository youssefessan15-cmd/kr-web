
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1c">
<title>KR WEB - Community</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #080d1c;
  color: white;
  padding: 25px 15px;
}

.container {
  width: 100%;
  max-width: 850px;
  margin: 30px auto;
  background: #111b30;
  border: 1px solid #263b62;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 15px 50px #0008;
}

.logo {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  color: #61a5ff;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #9aabc4;
  margin-bottom: 28px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 14px;
  border: 1px solid #344969;
  border-radius: 9px;
  background: #0b1427;
  color: white;
  outline: none;
  font-size: 15px;
}

input:focus {
  border-color: #61a5ff;
}

button {
  padding: 13px 16px;
  border: none;
  border-radius: 9px;
  background: #2878e8;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #4590ff;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.auth-button {
  width: 100%;
}

.switch {
  text-align: center;
  color: #aab8d0;
  margin-top: 20px;
  font-size: 14px;
}

.switch span {
  color: #61a5ff;
  cursor: pointer;
  font-weight: bold;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

#appPanel {
  display: none;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.topbar p {
  color: #b8c6dc;
  overflow-wrap: anywhere;
}

.logout {
  background: #d94355;
}

.rooms {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.room-button {
  flex: 1;
  min-width: 110px;
  background: #1b2b49;
  border: 1px solid #344969;
}

.room-button.active {
  background: #2878e8;
  border-color: #61a5ff;
}

.chat-box {
  background: #0b1427;
  border: 1px solid #263b62;
  border-radius: 12px;
  padding: 15px;
}

.chat-heading {
  margin-bottom: 15px;
  color: #61a5ff;
}

#messages {
  height: 350px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 5px;
}

.chat-message {
  background: #172641;
  border: 1px solid #293e60;
  border-radius: 10px;
  padding: 12px;
  overflow-wrap: anywhere;
}

.chat-username {
  color: #61a5ff;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 6px;
}

.chat-text {
  color: #f0f4fb;
  line-height: 1.5;
  white-space: pre-wrap;
}

.chat-time {
  color: #8192ad;
  font-size: 11px;
  margin-top: 7px;
}

.empty {
  color: #8292aa;
  text-align: center;
  margin: auto;
}

.send-area {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.send-area input {
  margin: 0;
  min-width: 0;
}

.send-area button {
  min-width: 90px;
}

#chatStatus {
  color: #9aabc4;
  font-size: 13px;
  margin-top: 12px;
  text-align: center;
}

footer {
  text-align: center;
  color: #65758d;
  margin-top: 25px;
  font-size: 12px;
}

@media (max-width: 500px) {
  .container {
    padding: 20px 15px;
  }

  .send-area {
    flex-direction: column;
  }

  .send-area button {
    width: 100%;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="logo">KR WEB</div>
  <p class="subtitle">
    Your community. Your conversations. Your space.
  </p>

  <section id="auth">

    <div id="loginForm">
      <h2>Welcome Back</h2>

      <input id="loginEmail" type="email"
        placeholder="Email Address" autocomplete="email">

      <input id="loginPassword" type="password"
        placeholder="Password" autocomplete="current-password">

      <button class="auth-button" id="loginBtn">Login</button>

      <p class="switch">
        Don't have an account?
        <span id="showSignup">Create Account</span>
      </p>
    </div>

    <div id="signupForm" style="display:none">
      <h2>Create Account</h2>

      <input id="signupName" type="text"
        placeholder="Display Name" autocomplete="name">

      <input id="signupEmail" type="email"
        placeholder="Email Address" autocomplete="email">

      <input id="signupPassword" type="password"
        placeholder="Password (minimum 6 characters)"
        autocomplete="new-password">

      <button class="auth-button" id="signupBtn">
        Create Account
      </button>

      <p class="switch">
        Already have an account?
        <span id="showLogin">Login</span>
      </p>
    </div>

    <p id="message" role="status" aria-live="polite"></p>
  </section>


  <section id="appPanel">

    <div class="topbar">
      <p id="userInfo">Welcome, Member</p>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>

    <h2>Community Chat</h2>

    <div class="rooms">
      <button class="room-button active" data-room="general">
        General
      </button>

      <button class="room-button" data-room="gaming">
        Gaming
      </button>

      <button class="room-button" data-room="technology">
        Technology
      </button>
    </div>

    <div class="chat-box">
      <h3 class="chat-heading" id="roomTitle">
        # General
      </h3>

      <div id="messages">
        <p class="empty">Loading messages...</p>
      </div>

      <div class="send-area">
        <input
          id="messageInput"
          type="text"
          maxlength="1000"
          placeholder="Write a message..."
        >
        <button id="sendBtn">Send</button>
      </div>

      <p id="chatStatus" role="status" aria-live="polite"></p>
    </div>

  </section>

  <footer>
    © 2026 KR WEB. All rights reserved.
  </footer>

</main>


<script type="module">

import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged,
  updateProfile
} from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  onSnapshot,
  serverTimestamp,
  limit
} from
  "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


// Firebase Configuration

const firebaseConfig = {
  apiKey: "AIzaSyBAJ9cMRt2-tCepCO8OqyX8PmMBoz8x9PU",
  authDomain: "kr-app-5662d.firebaseapp.com",
  projectId: "kr-app-5662d",
  storageBucket: "kr-app-5662d.firebasestorage.app",
  messagingSenderId: "795589994196",
  appId: "1:795589994196:web:54de63927ec9043118fd41",
  measurementId: "G-GMVGHLFYM2"
};


// Initialize Firebase

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);

let currentUser = null;
let activeRoom = "general";
let unsubscribeMessages = null;


// Authentication messages

function showMessage(text, success = false) {
  $("message").textContent = text;
  $("message").style.color =
    success ? "#55d99b" : "#ff8d8d";
}

function showChatStatus(text, success = false) {
  $("chatStatus").textContent = text;
  $("chatStatus").style.color =
    success ? "#55d99b" : "#ff8d8d";
}


// Switch forms

$("showSignup").onclick = () => {
  $("loginForm").style.display = "none";
  $("signupForm").style.display = "block";
  showMessage("");
};

$("showLogin").onclick = () => {
  $("signupForm").style.display = "none";
  $("loginForm").style.display = "block";
  showMessage("");
};


// Create account

$("signupBtn").onclick = async () => {
  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;

  if (!name || !email || !password) {
    return showMessage("Please fill in all fields.");
  }

  if (password.length < 6) {
    return showMessage(
      "Password must be at least 6 characters."
    );
  }

  $("signupBtn").disabled = true;
  showMessage("Creating your account...", true);

  try {
    const result = await createUserWithEmailAndPassword(
      auth, email, password
    );

    await updateProfile(result.user, {
      displayName: name
    });

    showMessage("Account created successfully!", true);

  } catch (error) {
    console.error(error);
    showMessage(error.message);
  } finally {
    $("signupBtn").disabled = false;
  }
};


// Login

$("loginBtn").onclick = async () => {
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if (!email || !password) {
    return showMessage("Enter your email and password.");
  }

  $("loginBtn").disabled = true;
  showMessage("Logging in...", true);

  try {
    await signInWithEmailAndPassword(
      auth, email, password
    );

    showMessage("Login successful!", true);

  } catch (error) {
    console.error(error);
    showMessage(error.message);
  } finally {
    $("loginBtn").disabled = false;
  }
};


// Logout

$("logoutBtn").onclick = async () => {
  try {
    await signOut(auth);
  } catch (error) {
    console.error(error);
    showChatStatus(error.message);
  }
};


// Format message time

function formatTime(timestamp) {
  if (!timestamp || !timestamp.toDate) {
    return "";
  }

  return timestamp.toDate().toLocaleString();
}


// Display messages safely

function displayMessages(snapshot) {
  const area = $("messages");
  area.replaceChildren();

  const docs = snapshot.docs.slice();

  docs.sort((a, b) => {
    const timeA = a.data().createdAt?.toMillis?.() || 0;
    const timeB = b.data().createdAt?.toMillis?.() || 0;
    return timeA - timeB;
  });

  if (docs.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "No messages yet. Start the conversation!";
    area.appendChild(empty);
    return;
  }

  docs.forEach((doc) => {
    const data = doc.data();

    const card = document.createElement("div");
    card.className = "chat-message";

    const username = document.createElement("div");
    username.className = "chat-username";
    username.textContent = data.username || "Member";

    const text = document.createElement("div");
    text.className = "chat-text";
    text.textContent = data.text || "";

    const time = document.createElement("div");
    time.className = "chat-time";
    time.textContent = formatTime(data.createdAt);

    card.append(username, text, time);
    area.appendChild(card);
  });

  area.scrollTop = area.scrollHeight;
}


// Listen to selected room

function openRoom(roomId) {
  activeRoom = roomId;

  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  const titles = {
    general: "General",
    gaming: "Gaming",
    technology: "Technology"
  };

  $("roomTitle").textContent = "# " + titles[roomId];
  $("messages").innerHTML =
    '<p class="empty">Loading messages...</p>';

  showChatStatus("Connecting to chat...", true);

  document.querySelectorAll(".room-button").forEach((button) => {
    button.classList.toggle(
      "active",
      button.dataset.room === roomId
    );
  });

  const messagesQuery = query(
    collection(db, "messages"),
    where("roomId", "==", roomId),
    limit(100)
  );

  unsubscribeMessages = onSnapshot(
    messagesQuery,
    (snapshot) => {
      displayMessages(snapshot);
      showChatStatus("Live chat connected.", true);
    },
    (error) => {
      console.error(error);
      showChatStatus("Could not load messages: " + error.message);
    }
  );
}


// Switch rooms

document.querySelectorAll(".room-button").forEach((button) => {
  button.onclick = () => {
    openRoom(button.dataset.room);
  };
});


// Send message

async function sendMessage() {
  if (!currentUser) {
    return showChatStatus("Please login first.");
  }

  const text = $("messageInput").value.trim();

  if (!text) {
    return;
  }

  if (text.length > 1000) {
    return showChatStatus("Message is too long.");
  }

  $("sendBtn").disabled = true;
  showChatStatus("Sending...", true);

  try {
    await addDoc(collection(db, "messages"), {
      uid: currentUser.uid,
      username: currentUser.displayName || "Member",
      text: text,
      roomId: activeRoom,
      createdAt: serverTimestamp()
    });

    $("messageInput").value = "";
    showChatStatus("Message sent!", true);

  } catch (error) {
    console.error(error);
    showChatStatus("Could not send message: " + error.message);
  } finally {
    $("sendBtn").disabled = false;
  }
}

$("sendBtn").onclick = sendMessage;

$("messageInput").addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    sendMessage();
  }
});


// Authentication state

onAuthStateChanged(auth, (user) => {
  currentUser = user;

  if (user) {
    $("auth").style.display = "none";
    $("appPanel").style.display = "block";

    $("userInfo").textContent =
      "Welcome, " + (user.displayName || "Member");

    openRoom(activeRoom);

  } else {
    $("auth").style.display = "block";
    $("appPanel").style.display = "none";

    if (unsubscribeMessages) {
      unsubscribeMessages();
      unsubscribeMessages = null;
    }

    showMessage("");
  }
});

</script>

</body>
</html>
