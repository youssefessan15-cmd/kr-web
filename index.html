
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1c">
  <title>KR WEB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #172b55 0%, #080d1c 55%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 27, 49, 0.96);
      border: 1px solid #263b62;
      border-radius: 20px;
      padding: 35px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #61a5ff;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #aab8d0;
      margin-bottom: 30px;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 22px;
      font-size: 23px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #344969;
      border-radius: 10px;
      background: #0b1427;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #61a5ff;
    }

    input::placeholder {
      color: #8291aa;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2878e8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    button:hover {
      background: #4590ff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 22px;
      color: #aab8d0;
      font-size: 14px;
    }

    .switch span {
      color: #61a5ff;
      cursor: pointer;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #welcome {
      display: none;
      text-align: center;
    }

    #welcome p {
      color: #b8c5dc;
      margin: 18px 0;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      color: #7788a5;
      font-size: 12px;
      margin-top: 28px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">KR WEB</div>

    <p class="subtitle">
      Your community. Your conversations. Your space.
    </p>

    <section id="auth">

      <div id="loginForm">
        <h2>Welcome Back</h2>

        <input
          type="email"
          id="loginEmail"
          placeholder="Email Address"
          autocomplete="email"
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button id="loginBtn">Login</button>

        <p class="switch">
          Don't have an account?
          <span id="showSignup">Create Account</span>
        </p>
      </div>

      <div id="signupForm" style="display:none;">
        <h2>Create Account</h2>

        <input
          type="text"
          id="signupName"
          placeholder="Your Name"
          autocomplete="name"
        >

        <input
          type="email"
          id="signupEmail"
          placeholder="Email Address"
          autocomplete="email"
        >

        <input
          type="password"
          id="signupPassword"
          placeholder="Password (minimum 6 characters)"
          autocomplete="new-password"
        >

        <button id="signupBtn">Create Account</button>

        <p class="switch">
          Already have an account?
          <span id="showLogin">Login</span>
        </p>
      </div>

    </section>

    <section id="welcome">
      <h2>Welcome to KR WEB!</h2>

      <p id="userEmail"></p>

      <button id="logoutBtn">Logout</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <footer class="footer">
      © 2026 KR WEB. All rights reserved.
    </footer>

  </main>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      updateProfile
    } from
      "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


    // Firebase Configuration

    const firebaseConfig = {
      apiKey: "AIzaSyBAJ9cMRt2-tCepCO8OqyX8PmMBoz8x9PU",
      authDomain: "kr-app-5662d.firebaseapp.com",
      projectId: "kr-app-5662d",
      storageBucket: "kr-app-5662d.firebasestorage.app",
      messagingSenderId: "795589994196",
      appId: "1:795589994196:web:54de63927ec9043118fd41",
      measurementId: "G-GMVGHLFYM2"
    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const $ = (id) => document.getElementById(id);


    // Messages

    function showMessage(message, success = false) {
      $("message").textContent = message;
      $("message").style.color =
        success ? "#55d99b" : "#ff8d8d";
    }


    // Switch to Signup

    $("showSignup").onclick = () => {
      $("loginForm").style.display = "none";
      $("signupForm").style.display = "block";
      showMessage("");
    };


    // Switch to Login

    $("showLogin").onclick = () => {
      $("signupForm").style.display = "none";
      $("loginForm").style.display = "block";
      showMessage("");
    };


    // Create Account

    $("signupBtn").onclick = async () => {

      const name = $("signupName").value.trim();
      const email = $("signupEmail").value.trim();
      const password = $("signupPassword").value;

      if (!name || !email || !password) {
        return showMessage("Please fill in all fields.");
      }

      if (password.length < 6) {
        return showMessage(
          "Password must be at least 6 characters."
        );
      }

      $("signupBtn").disabled = true;
      showMessage("Creating your account...", true);

      try {

        const result = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        await updateProfile(result.user, {
          displayName: name
        });

        showMessage(
          "Account created successfully!",
          true
        );

      } catch (error) {

        console.error(error);
        showMessage(error.message);

      } finally {

        $("signupBtn").disabled = false;

      }
    };


    // Login

    $("loginBtn").onclick = async () => {

      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;

      if (!email || !password) {
        return showMessage(
          "Enter your email and password."
        );
      }

      $("loginBtn").disabled = true;
      showMessage("Logging in...", true);

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage("Login successful!", true);

      } catch (error) {

        console.error(error);
        showMessage(error.message);

      } finally {

        $("loginBtn").disabled = false;

      }
    };


    // Logout

    $("logoutBtn").onclick = async () => {

      try {

        await signOut(auth);
        showMessage("You have logged out successfully.", true);

      } catch (error) {

        console.error(error);
        showMessage(error.message);

      }
    };


    // Check Login Status

    onAuthStateChanged(auth, (user) => {

      if (user) {

        $("auth").style.display = "none";
        $("welcome").style.display = "block";

        $("userEmail").textContent =
          (user.displayName || "Member") +
          " — " +
          user.email;

      } else {

        $("auth").style.display = "block";
        $("welcome").style.display = "none";

      }

    });

  </script>

</body>
</html>
